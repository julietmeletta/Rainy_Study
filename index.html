<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainy Study Room</title>

<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<link href="index.css" rel="stylesheet">

</head>

<body>

<video autoplay muted loop id="bg">
  <source src="rainyBG.mp4" type="video/mp4">
</video>

<div class="container">

    <div class="header">
        <h1>Rainy Study Room</h1>
        <h4>Come Rest & Study — Stay Focused</h4>
    </div>

    <div class="panel">
        <ul id="taskList"></ul>

        <input id="taskInput" placeholder="Add a task...">
        <button id="addTask" onclick="addTask()">Add Task</button>

        <div class="progress-container">
            <div class="progress-text">Progress</div>
            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>
        </div>
    </div>
</div>

<div class="timer-widget">
    <div>Study Timer</div>
    <div id="time">25:00</div>
    <button id="play" onclick="startTimer()">&#9654;</button>
    <button id="pause" onclick="pauseTimer()">&#9208;</button>
    <button id="reset" onclick="resetTimer()">&#10227;</button>
</div>
<script src = "s.js"></script>
</body>
</html>
